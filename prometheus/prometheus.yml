# Prometheus scrapes the gateway's /metrics endpoint.
# Pattern from Prometheus's configuration docs (global, scrape_configs, authorization) and
# LiteLLM's Prometheus page ("Authentication on /metrics endpoint").
global:
  scrape_interval: 5s  # default is 1m; 5s so a test sees a new request within seconds

scrape_configs:
  - job_name: litellm
    # /metrics needs a LiteLLM key (LiteLLM's default since v1.85.0). Kept on: anyone on the
    # network could otherwise read per-key usage. The key arrives as a compose secret file.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/litellm_master_key
    static_configs:
      - targets: ["litellm:4000"]  # the gateway's name on the offline network
